version: 2

models:
  - name: fct_orders
    description: "Core sales order fact table at the order grain, enriched with item rollups and net pricing."
    columns:
      - name: order_key
        description: "Primary key for the fact table."
        tests:
          - unique
          - not_null
      - name: customer_key
        description: "Foreign key referencing dim_customers."
        tests:
          - not_null
          - relationships:
              to: ref('dim_customers')
              field: customer_key
      - name: order_status_code
        description: "Single-character status identifier."
        tests:
          - not_null
          - accepted_values:
              values: ['O', 'F', 'P']
      - name: net_sales_amount
        description: "Net revenue generated by the order after discounts."
        tests:
          - not_null

  - name: dim_customers
    description: "Consolidated customer dimension table enriched with lifetime spend and order frequency."
    columns:
      - name: customer_key
        description: "Primary key identifying the customer."
        tests:
          - unique
          - not_null
      - name: customer_status
        description: "Categorical status: Active (orders placed) or Prospect."
        tests:
          - accepted_values:
              values: ['Active', 'Prospect']
      - name: lifetime_net_spend
        description: "Cumulative net revenue attributed to this customer."
        tests:
          - not_null

    - name: dim_dates
    description: "Standard enterprise calendar dimension table for time-series analysis."
    columns:
      - name: date_day
        description: "Primary key date."
        tests:
          - unique
          - not_null
